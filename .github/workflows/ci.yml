name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build first: worker.ts imports ./build/server, so typecheck needs it
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check and auto-fix formatting
        run: |
          if ! npm run format:check; then
            echo "Formatting differences detected. Applying Prettier..."
            npm run format
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -am "chore(format): auto-format code with prettier [skip ci]" || true
              git push origin main || true
            else
              echo "::notice::Prettier formatting differences detected and auto-formatted during CI verification."
            fi
          fi

      - name: Lint
        run: npm run lint
